apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Versionado automático: versionCode = nº de commits (crece solo en cada release
// y Android lo exige creciente para actualizar encima); versionName = "1.<nº>".
// Se puede forzar con -PversionCodeManual=N. Sin git, versionCode 1 (instalable
// pero no actualizará una versión mayor: compilar siempre desde el repo).
def commitsGit = {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootDir)
        def out = proc.text.trim()
        proc.waitFor()
        return proc.exitValue() == 0 && out.isInteger() ? out.toInteger() : 1
    } catch (Exception e) {
        return 1
    }
}
def codigoVersion = project.hasProperty('versionCodeManual') ? project.property('versionCodeManual').toInteger() : commitsGit()

android {
    namespace = "com.terrikola.musicsippi"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.terrikola.musicsippi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode codigoVersion
        versionName "1.${codigoVersion}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }
    // Firma de release: claves FUERA del repo (~/.musicsippi/firma.properties +
    // el .jks). Sin ese archivo el release sale sin firmar y el debug no cambia.
    def firmaProps = new Properties()
    def firmaArchivo = new File(System.getProperty('user.home'), '.musicsippi/firma.properties')
    if (firmaArchivo.exists()) firmaArchivo.withInputStream { firmaProps.load(it) }
    signingConfigs {
        if (firmaArchivo.exists()) {
            release {
                storeFile file(firmaProps['storeFile'])
                storePassword firmaProps['storePassword']
                keyAlias firmaProps['keyAlias']
                keyPassword firmaProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (firmaArchivo.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Reproductor nativo (ReproductorNativoPlugin / PlaybackService)
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    implementation 'com.google.guava:guava:33.4.8-android'
    // Selector de salida de audio (Dispositivos): SystemOutputSwitcherDialogController
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    // Resolución de audio de YouTube: InnerTubeX, igual que BitChord (catálogo de
    // clientes probados + descifrado de firma/n). Ktor y QuickJS en sus versiones.
    implementation "com.github.MetrolistGroup.innertubex:innertubex-android:v0.7.0"
    implementation "io.ktor:ktor-client-core:3.5.2"
    implementation "io.ktor:ktor-client-okhttp:3.5.2"
    implementation "io.ktor:ktor-client-content-negotiation:3.5.2"
    implementation "io.ktor:ktor-serialization-kotlinx-json:3.5.2"
    implementation "io.github.dokar3:quickjs-kt-android:1.0.14"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
